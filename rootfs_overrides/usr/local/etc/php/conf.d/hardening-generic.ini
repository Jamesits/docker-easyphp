variables_order = "GPCS"
enable_dl = Off
disable_functions = exec, system, shell_exec, passthru, phpinfo, proc_open, popen, curl_multi_exec, parse_ini_file, show_source, highlight_file, dl, putenv, fopen_with_path, dbmopen, dbase_open, move_uploaded_file, chdir, mkdir, rmdir, chmod, rename, filepro, filepro_rowcount, filepro_retrieve, posix_mkfifo

; Disable PHP version reporting
expose_php = Off

; Disable treating remote URLs as local files for include/require statements
allow_url_fopen = Off
allow_url_include = Off
